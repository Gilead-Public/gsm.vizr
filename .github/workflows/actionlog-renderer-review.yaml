name: ActionLog renderer review
on:
  push:
    branches: [issue-63-adjusted-risk-column]
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: vizr
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Gilead-Public/gsm.viz
          ref: e28c329fa6380511b0be2e54ccd41a16e733b635
          path: renderer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
        working-directory: renderer
      - run: npm test -- --runInBand tests/groupOverview
        working-directory: renderer
      - run: npm run bundle
        working-directory: renderer
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-bundle
          path: |
            renderer/index.js
            renderer/index.js.map
      - name: Use rebuilt renderer
        run: cp renderer/index.js renderer/index.js.map vizr/inst/htmlwidgets/lib/gsm.viz-2.4.1/
      - run: npm ci
        working-directory: vizr/tests/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: vizr/tests/playwright
      - name: Check score flags and filtered columns
        run: npx playwright test legacy-widgets.spec.js --workers=1 --grep 'score rows do not|comparison column stable'
        working-directory: vizr/tests/playwright